name: Backup su Backblaze B2

# Settimanale piu' lancio a mano.
#
# NESSUN KEEPALIVE, ed e' una scelta con due ragioni indipendenti.
#   1. La disabilitazione degli schedule dopo 60 giorni e' documentata da
#      GitHub per i repository *pubblici*. Questo repository e' privato.
#   2. Anche se si applicasse, aggirarla e' una violazione dei termini di
#      servizio: GitHub ha disabilitato `gautamkrishnar/keepalive-workflow`,
#      l'azione piu' usata per questo scopo, proprio con quella motivazione.
#
# contenuti/_backup.json viene quindi committato per una ragione sola:
# alimentare il banner nel pannello, cioe' far sapere al Cliente quando e'
# stata fatta l'ultima copia. Non e' un espediente per tenere vivo il cron.
on:
  schedule:
    - cron: '17 3 * * 1'      # ogni lunedi' alle 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write              # serve solo al commit di contenuti/_backup.json

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Clona con tutta la storia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # la storia E' il backup: senza questo si copia una sola revisione
          # Senza questa riga `actions/checkout` lascia il token di Actions in
          # .git/config, alla voce `http.https://github.com/.extraheader`, e
          # .git/config entra nell'archivio insieme al resto della storia.
          # L'archivio va su B2 sotto Object Lock in GOVERNANCE: quello che ci
          # entra non si toglie prima della scadenza della retention, e la
          # chiave del workflow non ha `bypassGovernance`, di proposito.
          # Il token qui dentro serve a un passo solo, il `git push` in fondo,
          # che da ora se lo porta esplicito e non lo scrive su disco.
          persist-credentials: false

      - name: Prepara l'archivio
        id: archivio
        run: |
          set -euo pipefail
          DATA=$(date -u +%Y-%m-%d)
          NOME="demo-pannello-git-${DATA}.tar.gz"
          # admin/ resta fuori: 6,4 MB di software di terzi riscaricabile.
          # dist/ e node_modules/ sono generati. foto/ non e' materiale di progetto.
          tar --exclude='./admin' \
              --exclude='./dist' \
              --exclude='./node_modules' \
              --exclude='./foto' \
              -czf "/tmp/${NOME}" \
              ./contenuti ./assets ./.git
          BYTE=$(stat -c%s "/tmp/${NOME}")
          echo "nome=${NOME}"   >> "$GITHUB_OUTPUT"
          echo "byte=${BYTE}"   >> "$GITHUB_OUTPUT"
          echo "data=${DATA}"   >> "$GITHUB_OUTPUT"
          echo "Archivio: ${NOME} — $((BYTE/1024)) KB"
          # L'elenco si legge UNA volta in una variabile: con `tar | head` la
          # pipe si chiude dopo cinque righe, tar riceve SIGPIPE e `pipefail`
          # fa fallire il passo pur avendo gia' scritto l'archivio.
          ELENCO=$(tar -tzf "/tmp/${NOME}")
          echo "${ELENCO}" | head -5
          echo "voci totali: $(echo "${ELENCO}" | wc -l)"

          # --- presidio: il token di Actions non parte dentro l'archivio ---
          # Legge l'ARCHIVIO e non l'albero di lavoro: e' l'archivio che va su
          # B2, e da li' non si torna indietro. Il presidio esiste perche' la
          # riga `persist-credentials: false` del checkout e' una riga sola:
          # il giorno in cui sparisce, questo passo diventa rosso invece di
          # tornare a colare in silenzio.
          # Cerca `extraheader` e NON il prefisso del token: nell'header il
          # token e' base64 di `x-access-token:<token>`, quindi un secret
          # scanner che cerca `ghs_` in chiaro non trova niente. Provato il
          # 23/09/2026 su un archivio prodotto da queste stesse righe: il
          # `grep ghs_` esce vuoto, il `grep extraheader` no.
          # Si legge prima in una variabile, come il `tar -tzf` qui sopra, e
          # non con `tar ... | grep -q` dentro l'`if`. La forma con la pipe
          # oggi funzionerebbe, ed e' questo il punto: `grep -q` esce al primo
          # riscontro, ma con un .git/config da 281 byte tar ha gia' finito di
          # scrivere, non prende SIGPIPE e `pipefail` non ha niente da
          # segnalare. Misurato il 23/09/2026 su entrambe le forme: a 281 byte
          # scattano tutte e due, a 5.050.038 byte la forma con la pipe TACE
          # con il token dentro l'archivio — tar muore 141, la pipeline
          # fallisce e l'`if` legge quel fallimento come "nessun riscontro",
          # cioe' come un archivio pulito. Il presidio dipenderebbe dalla
          # dimensione di un file che non controlliamo noi.
          CONFIG_ARCHIVIATO=$(tar -xzOf "/tmp/${NOME}" ./.git/config 2>/dev/null || true)
          if grep -qi 'extraheader' <<< "${CONFIG_ARCHIVIATO}"; then
            echo "::error::L'archivio contiene http.extraheader: il token di Actions finirebbe su B2, dove non si cancella. Backup interrotto."
            rm -f "/tmp/${NOME}"
            exit 1
          fi
          echo "presidio: nessun extraheader nel .git/config archiviato (${#CONFIG_ARCHIVIATO} byte letti)"

      - name: Carica su B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: eu-central-003
        run: |
          set -euo pipefail
          # I valori incollati nei secret dal pannello web portano spesso un
          # a capo finale, e `aws` lo rifiuta con "Invalid endpoint" senza
          # dire perche'. Si ripulisce l'input invece di fidarsene.
          ENDPOINT=$(printf '%s' "${{ secrets.B2_ENDPOINT }}" | tr -d '\r\n[:space:]')
          BUCKET=$(printf '%s' "${{ secrets.B2_BUCKET }}" | tr -d '\r\n[:space:]')
          case "$ENDPOINT" in
            https://*) ;;
            *) echo "B2_ENDPOINT deve cominciare con https:// — trovato qualcosa di diverso"; exit 1 ;;
          esac
          echo "Endpoint: ${ENDPOINT%%.*}...  bucket: ${#BUCKET} caratteri"
          aws --endpoint-url "$ENDPOINT" \
              s3 cp "/tmp/${{ steps.archivio.outputs.nome }}" \
              "s3://${BUCKET}/demo-pannello-git/${{ steps.archivio.outputs.nome }}"

      - name: Registra l'esito in contenuti/_backup.json
        if: always()
        env:
          # Il checkout non lascia piu' credenziali in .git/config, quindi il
          # push si porta le sue. Vivono il tempo del job in una variabile
          # d'ambiente: non toccano il disco, quindi non toccano l'archivio.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ESITO="${{ job.status }}"
          cat > contenuti/_backup.json <<JSON
          {
            "_nota": "Scritto dal workflow di backup. Non modificare a mano: viene riscritto a ogni esecuzione.",
            "ultimo_backup": "${{ steps.archivio.outputs.data }}",
            "esito": "${ESITO}",
            "dimensione_byte": ${{ steps.archivio.outputs.byte || 0 }},
            "archivio": "${{ steps.archivio.outputs.nome }}",
            "destinazione": "Backblaze B2, bucket del Cliente",
            "contenuto": ["contenuti/", "assets/", "storia git"],
            "escluso": ["admin/ (software di terzi riscaricabile)", "dist/", "node_modules/"]
          }
          JSON
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contenuti/_backup.json
          git diff --staged --quiet || git commit -m "chore: esito del backup del ${{ steps.archivio.outputs.data }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
