# Backend GitHub nativo. L'editor si autentica con il proprio account GitHub;
# lo scambio code -> token avviene su api.netlify.com/auth (servizio OAuth di
# Netlify, gia' fornitore del sito). Nessun servizio terzo nella catena.
backend:
  name: github
  repo: giovannipaolofusco/demo-pannello-git
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}>'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}>'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}>'

logo_url: /assets/favicon/icon.svg
site_url: https://demo-pannello-git.netlify.app

locale: it

# La colonna di anteprima mostrava i campi grezzi e non somigliava al sito:
# il pannello resta il solo form.
editor:
  preview: false

# Le immagini caricate finiscono qui. Il .webp lo genera il build dal .jpg.
media_folder: "assets/img"
public_folder: "/assets/img"

collections:

  # ── MENU ───────────────────────────────────────────────────
  - name: menu
    label: "Menu"
    files:
      - name: menu
        label: "Voci del menu"
        file: "contenuti/menu.json"
        format: json
        fields:
          - name: sezioni
            label: "Sezioni"
            widget: list
            label_singular: "Sezione"
            summary: "{{fields.nome.it}}"
            fields:
              - name: nome
                label: "Nome della sezione"
                widget: object
                fields:
                  - {name: it, label: "Italiano", widget: string}
                  - {name: en, label: "English", widget: string}

              - name: voci
                label: "Piatti"
                widget: list
                label_singular: "Piatto"
                summary: "{{fields.nome.it}} — € {{fields.prezzo}}"
                fields:
                  - name: nome
                    label: "Nome del piatto"
                    widget: object
                    fields:
                      - {name: it, label: "Italiano", widget: string}
                      - name: en
                        label: "English"
                        widget: string
                        required: false
                        hint: "Lascia vuoto se il nome non si traduce. La voce resterà in italiano anche nella pagina inglese, con la nota esplicativa."

                  - name: prezzo
                    label: "Prezzo"
                    widget: number
                    value_type: float
                    min: 0
                    step: 0.5
                    hint: "Solo il numero: 14 oppure 14.5. Il simbolo e la virgola li mette il sito."

                  - name: allergeni
                    label: "Allergeni"
                    widget: select
                    multiple: true
                    required: true
                    hint: "Le 14 categorie del Reg. UE 1169/2011. Se il piatto non ne contiene nessuno, scegli «Nessuno»: lasciare vuoto non si distingue da un campo non compilato."
                    options:
                      - {label: "Nessuno — nessun allergene fra i 14", value: nessuno}
                      - {label: "Glutine", value: glutine}
                      - {label: "Crostacei", value: crostacei}
                      - {label: "Uova", value: uova}
                      - {label: "Pesce", value: pesce}
                      - {label: "Arachidi", value: arachidi}
                      - {label: "Soia", value: soia}
                      - {label: "Latte", value: latte}
                      - {label: "Frutta a guscio", value: frutta-a-guscio}
                      - {label: "Sedano", value: sedano}
                      - {label: "Senape", value: senape}
                      - {label: "Sesamo", value: sesamo}
                      - {label: "Solfiti", value: solfiti}
                      - {label: "Lupini", value: lupini}
                      - {label: "Molluschi", value: molluschi}

  # ── ORARI ──────────────────────────────────────────────────
  - name: orari
    label: "Orari"
    files:
      - name: orari
        label: "Orari di apertura"
        file: "contenuti/orari.json"
        format: json
        fields:
          - name: _nota
            label: "Nota interna"
            widget: text
            required: false
            hint: "Non compare sul sito."

          - {name: fuso, label: "Fuso orario", widget: hidden, default: "Europe/Rome"}

          - name: settimana
            label: "Settimana"
            widget: list
            label_singular: "Fascia di giorni"
            summary: "{{fields.etichetta.it}}"
            fields:
              - name: giorni
                label: "Giorni"
                widget: select
                multiple: true
                hint: "In inglese: è il formato che leggono i motori di ricerca."
                options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]

              - name: etichetta
                label: "Come appare nella tabella"
                widget: object
                fields:
                  - {name: it, label: "Italiano", widget: string, hint: "Es. Lunedì – Venerdì"}
                  - {name: en, label: "English", widget: string, hint: "Es. Monday – Friday"}

              - name: breve
                label: "Come appare nel footer"
                widget: object
                fields:
                  - {name: it, label: "Italiano", widget: string, hint: "Es. Lun–Ven"}
                  - {name: en, label: "English", widget: string, hint: "Es. Mon–Fri"}

              - name: chiuso
                label: "Chiuso tutto il giorno"
                widget: boolean
                default: false
                required: false
                hint: "Se attivo, lascia vuoti i turni qui sotto."

              - name: turni
                label: "Turni"
                widget: list
                required: false
                label_singular: "Turno"
                summary: "{{fields.apre}} – {{fields.chiude}}"
                fields:
                  - {name: apre, label: "Apre", widget: string, pattern: ['^\d{2}:\d{2}$', "Formato 12:00"]}
                  - {name: chiude, label: "Chiude", widget: string, pattern: ['^\d{2}:\d{2}$', "Formato 15:00"]}

          - name: chiusura_stagionale
            label: "Chiusura stagionale"
            widget: object
            required: false
            fields:
              # Il widget date non esiste piu' in Decap 3: datetime senza ora.
              # Si salva in YYYY-MM-DD, il formato che legge il generatore; a
              # video il giorno segue la lingua del browser.
              - {name: dal, label: "Dal", widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD"}
              - {name: al, label: "Al", widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD"}
              - name: nota
                label: "Testo dell'avviso"
                widget: object
                fields:
                  - {name: it, label: "Italiano", widget: string}
                  - {name: en, label: "English", widget: string}
              - name: chiuso_etichetta
                label: "Parola per «chiuso»"
                widget: object
                fields:
                  - {name: it, label: "Italiano", widget: string}
                  - {name: en, label: "English", widget: string}

  # ── PIATTI IN HOME ─────────────────────────────────────────
  - name: piatti
    label: "Piatti in evidenza"
    files:
      - name: piatti
        label: "Le tre schede in home"
        file: "contenuti/piatti.json"
        format: json
        fields:
          - name: piatti
            label: "Schede"
            widget: list
            label_singular: "Scheda"
            summary: "{{fields.nome.it}}"
            fields:
              - name: nome
                label: "Nome"
                widget: object
                fields:
                  - {name: it, label: "Italiano", widget: string}
                  - {name: en, label: "English", widget: string}

              - name: note
                label: "Descrizione breve"
                widget: object
                fields:
                  - {name: it, label: "Italiano", widget: text}
                  - {name: en, label: "English", widget: text}

              - name: allergeni
                label: "Allergeni"
                widget: select
                multiple: true
                required: true
                hint: "Se il piatto non ne contiene nessuno, scegli «Nessuno»."
                options:
                  - {label: "Nessuno — nessun allergene fra i 14", value: nessuno}
                  - {label: "Glutine", value: glutine}
                  - {label: "Crostacei", value: crostacei}
                  - {label: "Uova", value: uova}
                  - {label: "Pesce", value: pesce}
                  - {label: "Arachidi", value: arachidi}
                  - {label: "Soia", value: soia}
                  - {label: "Latte", value: latte}
                  - {label: "Frutta a guscio", value: frutta-a-guscio}
                  - {label: "Sedano", value: sedano}
                  - {label: "Senape", value: senape}
                  - {label: "Sesamo", value: sesamo}
                  - {label: "Solfiti", value: solfiti}
                  - {label: "Lupini", value: lupini}
                  - {label: "Molluschi", value: molluschi}

              - {name: prezzo, label: "Prezzo", widget: number, value_type: float, min: 0, step: 0.5}

              - name: immagine
                label: "Fotografia"
                widget: image
                media_library: {config: {multiple: false}}
                hint: "Viene alleggerita e ripulita dei metadati prima del caricamento."

              - name: alt
                label: "Descrizione della foto per chi non la vede"
                widget: object
                fields:
                  - {name: it, label: "Italiano", widget: string}
                  - {name: en, label: "English", widget: string}

